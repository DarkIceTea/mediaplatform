resources:
- deployment.yaml
- service.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: identity-api-env
  literals:
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY=in_memory
    - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    - HTTP_PORTS=8080
    - JwtSettings__Secret=super_secret_key_which_must_be_very_long_and_secure_12345!
    - JwtSettings__Issuer=MediaPlatformApi
    - JwtSettings__Audience=MediaPlatformClient
    - IDENTITYDB_HOST=postgres
    - IDENTITYDB_PORT=5432
    - IDENTITYDB_USERNAME=postgres
    - IDENTITYDB_PASSWORD=V3fnIU5UJ5SHpMVY8EKxLU
    - IDENTITYDB_URI=postgresql://postgres:{postgres-password-uri-encoded.value}@postgres:5432/identitydb
    - IDENTITYDB_JDBCCONNECTIONSTRING=jdbc:postgresql://postgres:5432/identitydb
    - IDENTITYDB_DATABASENAME=identitydb
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    - OTEL_SERVICE_NAME=identity-api
    - ASPNETCORE_URLS=http://+:8080;

secretGenerator:
- name: identity-api-secrets
  envs:
  - .identity-api.secrets
