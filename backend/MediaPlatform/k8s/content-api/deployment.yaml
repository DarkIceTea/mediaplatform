---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-api
  labels:
    app: content-api
spec:
  minReadySeconds: 60
  replicas: 1
  selector:
    matchLabels:
      app: content-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: content-api
    spec:
      containers:
      - name: content-api
        image: ghcr.io/darkicetea/mediaplatform-content-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        envFrom:
        - configMapRef:
            name: content-api-env
        - secretRef:
            name: content-api-secrets
      terminationGracePeriodSeconds: 180
