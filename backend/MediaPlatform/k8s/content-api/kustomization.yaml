resources:
- deployment.yaml
- service.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: content-api-env
  literals:
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY=in_memory
    - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    - HTTP_PORTS=8080
    - JwtSettings__Secret=super_secret_key_which_must_be_very_long_and_secure_12345!
    - JwtSettings__Issuer=MediaPlatformApi
    - JwtSettings__Audience=MediaPlatformClient
    - BLOGDB_HOST=postgres
    - BLOGDB_PORT=5432
    - BLOGDB_USERNAME=postgres
    - BLOGDB_PASSWORD=V3fnIU5UJ5SHpMVY8EKxLU
    - BLOGDB_URI=postgresql://postgres:{postgres-password-uri-encoded.value}@postgres:5432/blogdb
    - BLOGDB_JDBCCONNECTIONSTRING=jdbc:postgresql://postgres:5432/blogdb
    - BLOGDB_DATABASENAME=blogdb
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=FNPRHxAdQ7DYCXvqUMoHGI
    - REDIS_URI=http://:{redis-password-uri-encoded.value}@redis:6379
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    - OTEL_SERVICE_NAME=content-api
    - ASPNETCORE_URLS=http://+:8080;

secretGenerator:
- name: content-api-secrets
  envs:
  - .content-api.secrets
