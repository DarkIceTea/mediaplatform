apiVersion: batch/v1
kind: Job
metadata:
  name: identity-migration-job
  namespace: mediaplatform
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrator
          image: ghcr.io/darkicetea/mediaplatform-identity-api:latest
          imagePullPolicy: IfNotPresent
          args: ["--migrate"]
          envFrom:
            - configMapRef:
                name: identity-api-env
            - secretRef:
                name: identity-api-secrets