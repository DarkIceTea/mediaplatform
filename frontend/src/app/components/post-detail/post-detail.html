@if (isLoading()) {
  <p>Loading post...</p>
} @else if (post()) {
  <article class="post-detail">
    <a routerLink="/posts" class="back-link">← Back to feed</a>

    @if (post()?.coverImageUrl) {
      <div class="cover">
        <img [src]="post()?.coverImageUrl" alt="{{ post()?.title }}" />
      </div>
    }

    <h1>{{ post()?.title }}</h1>

    <div class="meta">
      <span>Author: <b>{{ post()?.author?.displayName }}</b></span>
      <span>•</span>
      <span>{{ post()?.createdAt | date:'longDate' }}</span>
      <button 
        class="like-btn" 
        [class.liked]="post()?.isLiked"
        [disabled]="!authService.isAuthenticated()"
        (click)="onToggleLike()">
        <span class="heart">{{ post()?.isLiked ? '❤️' : '🤍' }}</span>
        <span class="count">{{ post()?.likesCount }}</span>
      </button>
    </div>

    <div class="content">
      {{ post()?.content }}
    </div>
    <app-comments [postId]="post()!.id" />
  </article>
} @else {
  <p>Post not found.</p>
}
