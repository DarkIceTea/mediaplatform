@if (isLoading()) {
  <p>Loading video player...</p>
} @else if (video()) {
  <div class="watch-layout">
    <!-- Streaming player with thumbnail poster -->
    <div class="player-container">
      <video 
        controls 
        autoplay 
        [poster]="video()?.thumbnailUrl"
        class="video-player">
        <source [src]="video()?.videoUrl" type="video/mp4" />
        Your browser does not support embedded video playback.
      </video>
    </div>

    <!-- Video info -->
    <h1 class="video-title">{{ video()?.title }}</h1>

    <div class="video-meta">
      <div class="author-info">
        <span class="avatar">👤</span>
        <span class="name">{{ video()?.author?.displayName }}</span>
      </div>
      <div class="stats">
        <span>{{ video()?.viewsCount }} views</span>
        <span>•</span>
        <span>{{ video()?.createdAt | date:'longDate' }}</span>
          <button 
          class="like-btn" 
          [class.liked]="video()?.isLiked"
          [disabled]="!authService.isAuthenticated()"
          (click)="onToggleLike()">
          <span class="heart">{{ video()?.isLiked ? '❤️' : '🤍' }}</span>
          <span class="count">{{ video()?.likesCount }}</span>
        </button>
      </div>
    </div>

    @if (video()?.description) {
      <div class="description-box">
        {{ video()?.description }}
      </div>
    }

    <!-- Comments section below the video -->
    <app-comments [videoId]="video()!.id" />
  </div>
} @else {
  <p>Video not found.</p>
}
