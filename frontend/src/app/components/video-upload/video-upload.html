<div class="upload-container">
  <h1>Upload a video</h1>

  @if (errorMessage) {
    <div class="error">{{ errorMessage }}</div>
  }

  @if (isProcessing()) {
    <div class="processing-card">
      <h3>🎉 Video uploaded successfully!</h3>
      <p>A background worker is generating the thumbnail and processing the video... Redirecting to the feed...</p>
    </div>
  } @else {
    <form (submit)="onSubmit()">
      <div class="form-group">
        <label>Video file (.mp4):</label>
        <input type="file" (change)="onFileSelected($event)" accept="video/mp4,video/*" required />
      </div>

      <div class="form-group">
        <label>Title:</label>
        <input type="text" [(ngModel)]="title" name="title" placeholder="Enter a title..." required />
      </div>

      <div class="form-group">
        <label>Description:</label>
        <textarea [(ngModel)]="description" name="description" placeholder="What is this video about?" rows="4"></textarea>
      </div>

      <!-- Progress bar while uploading -->
      @if (isUploading()) {
        <div class="progress-wrapper">
          <div class="progress-bar" [style.width.%]="uploadProgress()"></div>
          <span class="progress-text">Uploading to server: {{ uploadProgress() }}%</span>
        </div>
      }

      <button type="submit" [disabled]="isUploading()">
        {{ isUploading() ? 'Uploading...' : 'Publish video' }}
      </button>
    </form>
  }
</div>
