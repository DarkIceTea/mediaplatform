<div class="create-post">
  <h1>Новая публикация</h1>

  @if (errorMessage) {
    <div class="error">{{ errorMessage }}</div>
  }

  <form (submit)="onSubmit()">
    <div class="form-group">
      <label>Обложка статьи:</label>
      <input type="file" (change)="onFileSelected($event)" accept="image/*" />
      
      @if (isUploading()) {
        <p class="loading">Загружаем картинку в MinIO...</p>
      }

      @if (coverImageUrl()) {
        <div class="preview">
          <img [src]="coverImageUrl()" alt="Превью" />
        </div>
      }
    </div>

    <div class="form-group">
      <input type="text" placeholder="Заголовок статьи" [(ngModel)]="title" name="title" required class="input-title" />
    </div>

    <div class="form-group">
      <textarea placeholder="Напишите текст вашей статьи..." [(ngModel)]="content" name="content" rows="10" required></textarea>
    </div>

    <button type="submit" [disabled]="isSubmitting() || isUploading()">
      {{ isSubmitting() ? 'Публикуем...' : 'Опубликовать' }}
    </button>
  </form>
</div>
