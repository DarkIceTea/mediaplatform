<div class="create-post">
  <h1>New post</h1>

  @if (errorMessage) {
    <div class="error">{{ errorMessage }}</div>
  }

  <form (submit)="onSubmit()">
    <div class="form-group">
      <label>Cover image:</label>
      <input type="file" (change)="onFileSelected($event)" accept="image/*" />
      
      @if (isUploading()) {
        <p class="loading">Uploading image to MinIO...</p>
      }

      @if (coverImageUrl()) {
        <div class="preview">
          <img [src]="coverImageUrl()" alt="Preview" />
        </div>
      }
    </div>

    <div class="form-group">
      <input type="text" placeholder="Post title" [(ngModel)]="title" name="title" required class="input-title" />
    </div>

    <div class="form-group">
      <textarea placeholder="Write your post..." [(ngModel)]="content" name="content" rows="10" required></textarea>
    </div>

    <button type="submit" [disabled]="isSubmitting() || isUploading()">
      {{ isSubmitting() ? 'Publishing...' : 'Publish' }}
    </button>
  </form>
</div>
