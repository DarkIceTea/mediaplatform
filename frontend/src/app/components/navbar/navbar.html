<nav class="navbar">
  <div class="logo" routerLink="/videos">🎬 MediaPlatform</div>
  <div class="links">
    <a routerLink="/videos">Видео</a>
    <a routerLink="/posts">Блог</a>
    @if (authService.isAuthenticated()) {
      <a routerLink="/videos/upload" class="btn-upload">⬆ Загрузить видео</a>
      <a routerLink="/posts/create" class="btn-create">+ Статья</a>
      <span class="user-info">👤 {{ authService.currentUser()?.displayName }}</span>
      <button (click)="onLogout()" class="btn-logout">Выйти</button>
    } @else {
      <a routerLink="/login" class="btn-login">Войти</a>
    }
  </div>
</nav>
