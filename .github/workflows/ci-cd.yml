name: MediaPlatform CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: write 

jobs:
  
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build .NET Solution
        working-directory: backend/MediaPlatform
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release

  
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Angular
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration production

  
  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Create mock secrets for Kustomize validation
        run: |
          find backend/MediaPlatform/k8s -name "kustomization.yaml" | while read -r file; do
            dir=$(dirname "$file")
            (grep -oE '[^[:space:]]+\.secrets' "$file" || true) | while read -r secret; do
              echo "Creating mock secret: $dir/$secret"
              echo "MOCK_KEY=mock_value" > "$dir/$secret"
            done
          done

      - name: Validate Kustomize build
        run: |
          kubectl kustomize backend/MediaPlatform/k8s > /dev/null
          echo "Kubernetes manifests are valid!"
          


  publish-docker:
    needs: [ build-backend, build-frontend, validate-k8s ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: identity-api
            context: backend/MediaPlatform
            dockerfile: backend/MediaPlatform/MediaPlatform.Identity.Api/Dockerfile
          - name: media-api
            context: backend/MediaPlatform
            dockerfile: backend/MediaPlatform/MediaPlatform.Media.Api/Dockerfile
          - name: content-api
            context: backend/MediaPlatform
            dockerfile: backend/MediaPlatform/MediaPlatform.Content.Api/Dockerfile
          - name: chat-api
            context: backend/MediaPlatform
            dockerfile: backend/MediaPlatform/MediaPlatform.Chat.Api/Dockerfile
          - name: gateway
            context: backend/MediaPlatform
            dockerfile: backend/MediaPlatform/MediaPlatform.Gateway/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        run: echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/mediaplatform-${{ matrix.name }}:latest
            ghcr.io/${{ env.REPO_OWNER }}/mediaplatform-${{ matrix.name }}:${{ github.sha }}
